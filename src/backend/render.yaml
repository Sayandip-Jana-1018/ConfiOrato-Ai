services:
  - type: web
    name: confiorato-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_server:app
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://confiorato-ai.vercel.app
      - key: DEBUG
        value: False
